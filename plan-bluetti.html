.brand span{color:#7FD4F5!important;font-size:.62em;letter-spacing:.18em;font-weight:500}
.cat-nav-btn{background:linear-gradient(135deg,#1FA2E0,#1787C4)!important;border-radius:10px!important;color:#fff!important;letter-spacing:.04em}
.cat-nav-btn:hover{box-shadow:0 8px 20px rgba(31,162,224,.45)!important;transform:translateY(-1px)}
.api-dot.ok{background:#2ED3B7!important;box-shadow:0 0 8px #2ED3B7aa!important}

/* ---- hero estilo CES ---- */
.hero{background:linear-gradient(-45deg,#0A1633,#22376B,#4C63A8,#0A1633)!important;background-size:300% 300%!important;position:relative;overflow:hidden}
.hero:before{content:"2026";position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);font-family:var(--font-head);font-weight:700;font-size:clamp(170px,27vw,360px);line-height:1;letter-spacing:.05em;color:#fff;opacity:.075;pointer-events:none;white-space:nowrap}
.hero:after{content:"";position:absolute;top:-170px;right:-130px;width:580px;height:580px;border-radius:50%;background:radial-gradient(circle,rgba(127,212,245,.32),transparent 65%);pointer-events:none}
.hero .hero-badges,.hero h1,.hero .sub,.hero .kpi-strip{position:relative;z-index:2}
.hero h1{text-transform:uppercase;letter-spacing:.08em;font-weight:700!important;font-size:clamp(30px,5vw,52px)!important}
.hero .sub{color:#B9D4F2!important;letter-spacing:.24em;text-transform:uppercase;font-size:11px!important}
.hero .badge,.hero .badge-active{background:rgba(255,255,255,.1)!important;border:1px solid rgba(255,255,255,.22);color:#EAF4FF!important;border-radius:999px;backdrop-filter:blur(6px);letter-spacing:.09em;font-size:10.5px}
.dot-active{background:#2ED3B7!important;box-shadow:0 0 10px #2ED3B7!important}

/* ---- KPIs glass ---- */
.kpi-strip{gap:12px}
.kp{background:rgba(255,255,255,.08)!important;border:1px solid rgba(255,255,255,.16)!important;border-radius:14px!important;box-shadow:none!important;backdrop-filter:blur(8px);transition:transform .2s,border-color .2s;min-width:88px}
.kp:hover{transform:translateY(-3px);border-color:var(--primary-light)!important}
.kp .num{color:#fff!important;font-size:34px!important;font-weight:700;letter-spacing:.02em}
.kp .lb{color:#B9D4F2!important;text-transform:uppercase;letter-spacing:.14em;font-size:9px!important}

/* ---- tabs de mes ---- */
.mtab.active{background:linear-gradient(135deg,#1FA2E0,#1787C4)!important;box-shadow:0 6px 16px rgba(31,162,224,.35)!important}
.mtab:hover{background:rgba(31,162,224,.12)!important;color:var(--primary)!important}

/* ---- semanas ---- */
.week-card{border-radius:16px;box-shadow:0 3px 16px rgba(20,50,100,.08)}
.week-card .week-top{background:linear-gradient(135deg,#0B1B3B,#1B3564)!important;color:#fff!important;border-bottom:3px solid var(--primary)!important}
.week-top h2{color:#fff!important;letter-spacing:.03em;font-weight:700}
.week-summary{color:#B9D4F2!important}
.week-arrow{color:#7FD4F5!important}
.week-card.week-future .week-top{background:linear-gradient(135deg,#0B1B3B,#1B3564)!important;color:#fff!important;border-color:transparent!important}
.week-card.week-current .week-top{background:linear-gradient(135deg,#12294F,#2B4A88)!important;border-bottom:3px solid var(--primary-light)!important}
.week-card.week-current{border-left:4px solid var(--primary-light)!important;background:rgba(31,162,224,.05)!important;box-shadow:0 4px 22px rgba(31,162,224,.16)}
.week-card.week-done .week-top{background:linear-gradient(135deg,#0B1B3B,#14406B)!important;color:#fff!important}
.week-check-all{border-radius:8px;font-family:var(--font-head)}

/* ---- piezas ---- */
.piece{border-radius:12px;border-left-width:4px;box-shadow:0 2px 10px rgba(20,50,100,.06)}
.piece:hover{box-shadow:0 12px 28px rgba(31,162,224,.22)!important;transform:translateY(-2px)!important;border-color:var(--primary-light)!important}
.piece[data-format=carrusel]{--fmt-color:#1FA2E0;--fmt-bg:rgba(31,162,224,.12);--fmt-border:rgba(31,162,224,.3);border-left-color:#1FA2E0}
.piece[data-format=post]{--fmt-color:#3D5AFE;--fmt-bg:rgba(61,90,254,.1);--fmt-border:rgba(61,90,254,.28);border-left-color:#3D5AFE}
.piece .topic{font-weight:600;letter-spacing:.01em;color:#0B1B3B}
.piece .fmt{letter-spacing:.12em}
.piece .num{font-family:var(--font-head)}
.cal-col{background:linear-gradient(180deg,#fff,#FAFCFF)}
.cal-col.col-today .col-head{background:linear-gradient(135deg,#1FA2E0,#1787C4)!important}
.col-head .day{font-family:var(--font-head);letter-spacing:.06em}
.pillar-bar div{filter:saturate(1.08)}
.pillar-legend-dot{filter:saturate(1.15)}

/* ---- panel de productos ---- */
.piece .prods.oct-prods summary{color:#0E6FA8!important;background:rgba(31,162,224,.1)!important;border-color:rgba(31,162,224,.3)!important;font-family:var(--font-head)}
.oct-panel{border-radius:14px!important;box-shadow:0 18px 44px rgba(10,30,70,.22)!important}
.oct-head{background:linear-gradient(135deg,#0B1B3B,#1B3564);color:#fff!important;border-bottom:none}
.oct-x{background:rgba(255,255,255,.16)!important;color:#fff!important}

/* ---- botones ---- */
.copy-caption-btn{background:linear-gradient(135deg,#1FA2E0,#1787C4)!important;border-radius:10px!important;letter-spacing:.03em}
.copy-caption-btn.secondary{background:linear-gradient(135deg,#3D5AFE,#2B44C7)!important}
.copy-caption-btn:hover,.drive-btn:hover{box-shadow:0 10px 24px rgba(31,162,224,.4)!important;transform:translateY(-1px)}
.drive-btn{border-radius:10px!important;letter-spacing:.03em}
.export-btn{border-radius:8px!important}

/* ---- modal / paneles ---- */
.modal-box{border-radius:18px!important;overflow:hidden}
.modal-head{background:linear-gradient(135deg,#0B1B3B,#1B3564)!important;color:#fff!important}
.modal-head h3{color:#fff!important;letter-spacing:.06em}
.modal-close{background:rgba(255,255,255,.14)!important;color:#fff!important}
.slide-alt{border-left-color:var(--primary-light)!important}
.dp-h{background:linear-gradient(135deg,#0B1B3B,#1B3564)!important;color:#fff!important}

/* ---- footer ---- */
footer{background:#081226!important}
footer strong{color:#1FA2E0!important;letter-spacing:.16em;text-transform:uppercase;font-family:var(--font-head)}
footer p{color:#8FB2D8!important}

/* ---- scrollbar ---- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#1FA2E0,#1787C4);border-radius:8px}
::-webkit-scrollbar-track{background:#EAF1FA}
.prod-imagen{margin:0 0 14px;padding:11px 15px;background:rgba(31,162,224,.08);border:1px solid rgba(31,162,224,.25);border-radius:11px;font-size:12.5px;line-height:1.55;color:var(--text)}
.prod-imagen strong{display:block;font-family:var(--font-head);letter-spacing:.1em;text-transform:uppercase;font-size:10px;color:#0E6FA8;margin-bottom:3px}
.prod-imagen strong:before{content:""}
.prod-imagen span{color:var(--text)}
@keyframes copyPop{0%{transform:scale(.65);opacity:.4}55%{transform:scale(1.28)}100%{transform:scale(1);opacity:1}}
.copy-prod-btn.copied{opacity:1;animation:copyPop .38s cubic-bezier(.34,1.56,.64,1);background:rgba(46,211,183,.22);border-radius:9px;transform:scale(1.12)}
.cat-copy-sku.copied{animation:copyPop .38s ease}
</style>
